apply plugin: 'com.android.application'

// --- Release versioning & signing -------------------------------------------
// versionName/versionCode come from the environment so CI can stamp them from
// a tag (mobile-vX.Y.Z). Local builds fall back to the defaults below.
def mobileVersionName = System.getenv("HERMES_MOBILE_VERSION_NAME") ?: "0.1.0"
def mobileVersionCode = (System.getenv("HERMES_MOBILE_VERSION_CODE") ?: "1").toInteger()

// Release signing is opt-in. Provide EITHER android/keystore.properties
// (gitignored) with storeFile/storePassword/keyAlias/keyPassword, OR the
// HERMES_MOBILE_KEYSTORE_* env vars (CI decodes the keystore from a secret).
// Without them, release builds stay unsigned, exactly like stock Capacitor.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String key, String envName ->
    def fromEnv = System.getenv(envName)
    if (fromEnv) return fromEnv
    def fromFile = keystoreProperties.getProperty(key)
    return fromFile ?: null
}
def keystorePath = signingValue("storeFile", "HERMES_MOBILE_KEYSTORE_PATH")
def hasReleaseSigning = keystorePath != null &&
    signingValue("storePassword", "HERMES_MOBILE_KEYSTORE_PASSWORD") != null &&
    signingValue("keyAlias", "HERMES_MOBILE_KEY_ALIAS") != null &&
    signingValue("keyPassword", "HERMES_MOBILE_KEY_PASSWORD") != null

android {
    namespace = "com.nousresearch.hermes.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.nousresearch.hermes.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode mobileVersionCode
        versionName mobileVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(keystorePath)
                storePassword signingValue("storePassword", "HERMES_MOBILE_KEYSTORE_PASSWORD")
                keyAlias signingValue("keyAlias", "HERMES_MOBILE_KEY_ALIAS")
                keyPassword signingValue("keyPassword", "HERMES_MOBILE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MainActivity.java and HermesShellPlugin.java import these directly
    // (OnBackPressedCallback, PackageInfoCompat). capacitor-android declares
    // them as `implementation`, so they are not on this module's compile
    // classpath transitively — declare them here rather than rely on appcompat
    // happening to re-export them.
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
