name: Hermes Mobile (Android)

# Builds the Android app in apps/mobile and uploads an installable debug APK.
#
# THIS FILE IS STAGED, NOT ACTIVE. GitHub only runs workflows from
# .github/workflows/, and this branch's push token has no `workflows`
# permission, so it is committed here instead of being silently dropped.
# Activate it with:
#
#   git mv apps/mobile/ci/mobile-android.yml .github/workflows/mobile-android.yml
#
# The APK is a CI artifact on purpose: building it needs an Android SDK and a
# JDK, which a contributor working on the Python agent or the dashboard has no
# reason to have installed. The shell checks (typecheck, unit tests, lint) run in
# their own job so a TypeScript mistake fails in a minute instead of after a
# Gradle download.
#
# Debug builds are signed with the debug keystore — installable with
# `adb install -r`, not Play-Store distributable. Release signing is tracked in
# apps/mobile/PLAN.md (Phase 2).

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'package-lock.json'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell-checks:
    name: Shell typecheck, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24.11.1

      # Same scoped install the other app workflows use: this workspace's deps
      # only, no electron, no design-language packages.
      - name: Install workspace dependencies
        run: npm ci --workspace apps/mobile --include-workspace-root=false --no-audit --no-fund

      - name: Check the shell
        run: npm run check --workspace apps/mobile

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: shell-checks
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24.11.1

      # capacitor.build.gradle compiles at JavaVersion.VERSION_21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workspace dependencies
        run: npm ci --workspace apps/mobile --include-workspace-root=false --no-audit --no-fund

      - name: Build the shell and sync it into the Android project
        working-directory: apps/mobile
        run: |
          npm run build
          npx cap sync android

      # The runner image ships the Android SDK and exports ANDROID_HOME, so no
      # sdkmanager step and no local.properties are needed.
      - name: Assemble the debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report the artifact
        working-directory: apps/mobile/android
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Built $apk ($(du -h "$apk" | cut -f1))"
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$apk" 2>/dev/null | head -3 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-mobile-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
